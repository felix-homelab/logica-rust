[package]
name = "logica-vla"
description = "A virtual logic analyser: configurable random signals and protocols over TCP, for trying live capture without hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "logica-vla"
path = "src/main.rs"

[dependencies]
logica-core.workspace = true
logica-drivers.workspace = true
logica-protocols.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
