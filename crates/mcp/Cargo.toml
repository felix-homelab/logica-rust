[package]
name = "logica-mcp"
description = "Logica's MCP server: curated tools, resources and prompts over the command API (doc 07)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
logica-core.workspace = true
logica-engine.workspace = true
logica-protocols.workspace = true
bytes = "1"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-std", "io-util", "net"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-async-rw"] }

[lints]
workspace = true
