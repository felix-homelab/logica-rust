[package]
name = "logica-cli"
description = "The logica command: file tools on the engine in-process, and later the MCP relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "logica"
path = "src/main.rs"

[dependencies]
logica-core.workspace = true
logica-engine.workspace = true
logica-fileio.workspace = true
logica-mcp.workspace = true
logica-protocols.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
