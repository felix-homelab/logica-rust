name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (Linux) - format, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt, clippy, wasm32).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The FNIRSI example files are not in the repository; their tests print why they skip.
      - run: cargo test --workspace -- --nocapture

  rust-wasm:
    name: core and protocols build for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p logica-core -p logica-protocols --target wasm32-unknown-unknown

  rust-other:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  npm:
    name: npm workspace - build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the desktop app's build compiles the engine's Node-API module
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  desktop:
    name: Packaged app starts and reaches the engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # shared runners are slower than the machines the 1.5 s budget is for (doc 11, spike S7)
      LOGICA_COLD_START_LIMIT_MS: 3000
      # the runners' Chromium sandbox helper is not set up; the window's own sandbox stays on
      LOGICA_SMOKE_NO_SANDBOX: 1
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run package:dir -w apps/desktop
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -w apps/desktop
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke -w apps/desktop
