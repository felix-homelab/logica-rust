name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-checks:
    name: Repository checks - scripts, version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the checks of pr-rules and the release tag (CONTRIBUTING.md, RELEASING.md) have tests too
      - run: shellcheck -x -S warning .github/scripts/*.sh
      - run: bash .github/scripts/test-checks.sh
      # every file holds the same product version (RELEASING.md, "Versioning")
      - run: node scripts/set-version.mjs --check "$(node scripts/set-version.mjs --print)"

  rust-linux:
    name: Rust (Linux) - format, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt, clippy, wasm32).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The FNIRSI example files are not in the repository; their tests print why they skip.
      - run: cargo test --workspace -- --nocapture

  rust-wasm:
    name: core and protocols build for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p logica-core -p logica-protocols --target wasm32-unknown-unknown

  rust-other:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  npm:
    name: npm workspace - build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the desktop app's build compiles the engine's Node-API module
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  desktop:
    name: Desktop app - packaged smoke test and end-to-end tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # shared runners are slower than the machines the 1.5 s budget is for (doc 11, spike S7)
      LOGICA_COLD_START_LIMIT_MS: 3000
      # the runners' Chromium sandbox helper is not set up; the window's own sandbox stays on
      LOGICA_SMOKE_NO_SANDBOX: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # the real installers (NSIS, AppImage), so packaging problems show before a release
      - run: npm run package -w apps/desktop -- --publish never
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -w apps/desktop
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke -w apps/desktop
      - name: Electron for the end-to-end tests
        run: npm run electron -w apps/desktop
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -w apps/desktop
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e -w apps/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: apps/desktop/test-results/
